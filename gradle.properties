group = io.kestra.jetbrains
# Overridden from the release tag in CI (-Pversion=x.y.z).
version = 0.1.0-SNAPSHOT

# Lowest supported IDE: 2024.3. Its last bugfix release both IntelliJ IDEA and PyCharm have, so the tests run in both.
platformVersion = 2024.3.6
pluginSinceBuild = 243
# Newest release checked by the Plugin Verifier and the tests in other IDEs (testAllIdes).
latestPlatformVersion = 2026.3
# IDE codes checked by the Plugin Verifier (local only, not in CI) at 2024.3 and latestPlatformVersion. Each IDE is a ~1 GB
# download and ~4 GB unpacked, so the list is short; -PverifyIdes=GO checks another one.
# IU IntelliJ IDEA, PY PyCharm, WS WebStorm, GO GoLand, PS PhpStorm, RM RubyMine, CL CLion, RD Rider, RR RustRover, DB DataGrip.
verifyIdes = IU,PY

# The IDE provides the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
