<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
        font-family: var(--font);
        color: var(--fg);
        background-color: var(--bg);
        background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
        background-size: 24px 24px;
    }
    #message { color: var(--muted); padding: 16px; font-size: 13px; }
    #graph { width: 100vw; height: 100vh; display: none; }
    #rotate {
        position: fixed;
        bottom: 12px;
        right: 12px;
        display: none;
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 19px;
        line-height: 1;
    }
</style>
</head>
<body>
<div id="message">Loading topology…</div>
<div id="graph"></div>
<button id="rotate" title="Rotate layout">⟳</button>
<script>/*BRIDGE*/</script>
<script>/*CYTOSCAPE*/</script>
<script>/*DAGRE*/</script>
<script>/*TOPOLOGY*/</script>
</body>
</html>
